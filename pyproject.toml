[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inflow-outflow-centrality"
version = "0.1.0"
description = "Inflow and outflow centrality metrics for interaction networks, plus weighted degree and closeness centrality"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Aram Papazian" }]
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "networkx>=3.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/AramPapaz/Inflow-and-Outflow-Centrality"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["inflow_outflow_centrality"]
